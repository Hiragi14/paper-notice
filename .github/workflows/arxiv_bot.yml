name: Daily arXiv Fetcher

on:
  schedule:
    # 毎日 日本時間の朝9:00（UTCの午前0:00）に実行
    - cron: '22 59 8 * * *'
  workflow_dispatch: # 手動でいつでも実行できるようにするボタンを追加

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
    - name: コードをチェックアウト
      uses: actions/checkout@v4

    - name: Python環境のセットアップ
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: ライブラリのインストール
      run: |
        pip install arxiv requests deep-translator

    - name: スクリプトの実行
      env:
        DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      run: |
        for i in 1 2 3 4 5; do
          python fetch_arxiv.py && exit 0
          echo "Retry $i failed. Waiting..."
          sleep $((i * 90))
        done
        exit 1